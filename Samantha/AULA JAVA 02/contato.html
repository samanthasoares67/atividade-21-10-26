<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Entre em contato</h1>

    <p>Preencha o formulario para solicitar atendimento.</p>

    <form>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="servico">Produto ou serviço de interesse:</label>

        <select id="serviço" name="servico">
        <option value="banho">Banho e tosa</option>
        <option value="racao">Raçoes</option>
        <option value="acessorios">Acessorios</option>
        <option value="higiene">Produtos de higiene</option>
        </select>

        <br><br>

        <label for="mensagem">Mensagem:</label>
        
        <br>

        <textarea id="mensagem" name="mensagem" required></textarea>

        <br><br>

        <button type="submit">Enviar</button>

    </form>

    <p><a href="index.html">Voltar para a pagina inicial</a></p>
    
</body>

</html>
